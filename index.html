<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรียงดาวเคราะห์</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a24;font-family:"Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(880px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;
        display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 28px;
        background:linear-gradient(160deg,rgba(38,28,92,.97),rgba(12,16,52,.97));color:#eef0ff;border-radius:28px;
        border:2px solid rgba(160,140,255,.45);box-shadow:0 0 60px rgba(120,90,255,.35),0 18px 50px rgba(0,0,0,.5)}
  .card h1{margin:0;font-size:clamp(34px,5.4vw,62px);font-weight:800;line-height:1.15;
           background:linear-gradient(90deg,#ffd36b,#ff9ad5,#9ab8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card p{font-size:clamp(17px,2vw,23px);margin:0;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-size:clamp(19px,2.2vw,26px);font-weight:800;padding:12px 30px;border:0;border-radius:999px;cursor:pointer;color:#fff;
         background:linear-gradient(180deg,#7a6bff,#5140d6);box-shadow:0 6px 0 #3a2c9e,0 0 24px rgba(122,107,255,.5)}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #3a2c9e}
  button.blue{background:linear-gradient(180deg,#4fb8ff,#2f7fe0);box-shadow:0 6px 0 #1d5aa3,0 0 24px rgba(79,184,255,.45)}
  button.pink{background:linear-gradient(180deg,#ff7fb5,#e04d8c);box-shadow:0 6px 0 #a83366,0 0 24px rgba(255,127,181,.45)}
  button.tog{font-size:clamp(15px,1.6vw,20px);padding:8px 18px;background:rgba(255,255,255,.12);box-shadow:none;border:2px solid rgba(255,255,255,.25)}
  button.tog.on{background:linear-gradient(180deg,#ffd36b,#f0a830);color:#3a2400;border-color:transparent}
  .label{font-weight:600;font-size:18px}
  .hidden{display:none!important}
  #status{font-size:16px;color:#aab0e0}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<canvas id="u"></canvas>

<div id="start" class="card">
  <h1>เรียงดาวเคราะห์</h1>
  <p>ภารกิจนักบินอวกาศ! เอามือไปที่ดาวเคราะห์แล้ว<b>กำมือ</b>เพื่อจับ<br>ลากไปวงโคจรให้ถูกลำดับจากดวงอาทิตย์ แล้ว<b>แบมือ</b>เพื่อวาง<br>ระวังดาวหลอก ให้ทิ้งลงหลุมดำ และหลบอุกกาบาตด้วยนะ!</p>
  <div class="row">
    <span class="label">ระดับ:</span>
    <button id="lv1" class="tog on" onclick="setLevel(1)">ง่าย (มีชื่อใบ้)</button>
    <button id="lv2" class="tog" onclick="setLevel(2)">ยาก (ไม่มีใบ้)</button>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button class="pink" onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row">
    <button class="blue" onclick="showStart()">กลับเมนู</button>
  </div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ucanvas = document.getElementById('u'), U = ucanvas.getContext('2d');
let DPR = 1;
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const INK = 'rgba(10,8,40,.85)', PAPER = 'rgba(28,22,80,.88)', FONT = 'Kanit,Tahoma,sans-serif';
const P_COLORS = ['#ff5fa2', '#3fb6ff'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
const DUO_LIMIT = 120;
let W, H;

const PLANETS = [
  {n:'ดาวพุธ',      c1:'#d9d2c5', c2:'#7d746a', r:0.55, f:'ใกล้ดวงอาทิตย์ที่สุด โคจรรอบเร็วที่สุด ใช้แค่ 88 วัน'},
  {n:'ดาวศุกร์',    c1:'#ffe3a3', c2:'#c9932f', r:0.8,  f:'ร้อนที่สุดในระบบสุริยะ ร้อนพอจะละลายตะกั่วได้'},
  {n:'โลก',         c1:'#6fc3ff', c2:'#1f6fb8', r:0.85, land:true, f:'บ้านของเรา ดาวดวงเดียวที่รู้ว่ามีสิ่งมีชีวิต'},
  {n:'ดาวอังคาร',  c1:'#ff9a6b', c2:'#b0401c', r:0.65, f:'ดาวเคราะห์สีแดง เพราะดินมีสนิมเหล็กเยอะ'},
  {n:'ดาวพฤหัสบดี', c1:'#f3d2a8', c2:'#b9773f', r:1.45, bands:true, f:'ใหญ่ที่สุด ใส่โลกเข้าไปได้มากกว่า 1,000 ใบ'},
  {n:'ดาวเสาร์',    c1:'#f7e3a6', c2:'#c9a24f', r:1.25, ring:true, f:'มีวงแหวนสวยที่สุด ทำจากน้ำแข็งและหิน'},
  {n:'ดาวยูเรนัส',  c1:'#c9fbff', c2:'#5bbcc9', r:1.0,  f:'หมุนตะแคงข้าง เหมือนลูกบอลกลิ้งรอบดวงอาทิตย์'},
  {n:'ดาวเนปจูน',  c1:'#7aa2ff', c2:'#2342b0', r:0.98, f:'ไกลที่สุด และมีลมแรงที่สุดในระบบสุริยะ'},
];
const FAKES = [
  {n:'ดวงจันทร์', c1:'#f4f4f6', c2:'#9a9aa6', r:0.7, craters:true, fake:true, f:'ดวงจันทร์เป็นบริวารที่โคจรรอบโลก ไม่ใช่ดาวเคราะห์'},
  {n:'ดาวพลูโต', c1:'#efd9bf', c2:'#9c7c62', r:0.6, heart:true, fake:true, f:'ดาวพลูโตเคยเป็นดาวเคราะห์ ตอนนี้เป็นดาวเคราะห์แคระ'},
  {n:'ดาวเคราะห์น้อย', c1:'#b8a898', c2:'#6b5e50', r:0.6, rock:true, fake:true, f:'ดาวเคราะห์น้อยเป็นก้อนหินในอวกาศ เล็กเกินจะเป็นดาวเคราะห์'},
];
const OBJ = PLANETS.concat(FAKES);
// ลำดับจากเล็กไปใหญ่ (ขนาดจริง): พุธ อังคาร ศุกร์ โลก เนปจูน ยูเรนัส เสาร์ พฤหัสบดี
const SIZE_ORDER = [0, 3, 1, 2, 7, 6, 5, 4];
const SIZE_FACT = ['เล็กที่สุดในระบบสุริยะ','เล็กกว่าโลกประมาณครึ่งหนึ่ง','ขนาดเกือบเท่าโลก เหมือนฝาแฝด','บ้านของเรา ขนาดกลาง ๆ','ใหญ่กว่าโลกประมาณ 4 เท่า','ใหญ่กว่าดาวเนปจูนนิดเดียว','ใหญ่อันดับ 2 ใส่โลกได้ 700 กว่าใบ','ใหญ่ที่สุด! ใส่โลกได้มากกว่า 1,000 ใบ'];


// ---------- state ----------
let mode = 'solo', level = 1, state = 'menu', players = [], countdown = 0, lastT = 0, playT = 0;
let particles = [], stars = [], banner = null;
for (let i=0;i<140;i++) stars.push({x:Math.random(), y:Math.random(), s:Math.random()*2+0.5, p:Math.random()*6});

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR; ucanvas.width = W*DPR; ucanvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); U.setTransform(DPR,0,0,DPR,0,0);
  players.forEach(layoutPlayer);
}
addEventListener('resize', resize);

// ---------- sound ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='sine', vol=0.18, delay=0){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  grab:  ()=> tone(440, 0.08, 'triangle', 0.12),
  ok:    ()=>{ tone(660,0.1,'square',0.1); tone(990,0.18,'square',0.1,0.09); },
  bad:   ()=> tone(170, 0.3, 'square', 0.08),
  beep:  ()=> tone(520, 0.15, 'square', 0.1),
  go:    ()=> tone(880, 0.35, 'square', 0.12),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,'triangle',0.18,i*0.12)),
  whoosh:()=>{ for (let i=0;i<6;i++) tone(500 - i*70, 0.12, 'sine', 0.1, i*0.05); },
  rocket:()=>{ tone(200, 0.5, 'sawtooth', 0.05); tone(300, 0.5, 'triangle', 0.06); },
  flag:  ()=>{ tone(988, 0.1, 'triangle', 0.12); tone(1318, 0.15, 'triangle', 0.12, 0.08); },
  boom:  ()=>{ tone(120, 0.4, 'sawtooth', 0.12); tone(80, 0.5, 'square', 0.08, 0.05); },
};

// ---------- menu ----------
window.setLevel = lv => {
  level = lv;
  document.getElementById('lv1').classList.toggle('on', lv===1);
  document.getElementById('lv2').classList.toggle('on', lv===2);
};
window.showStart = ()=>{
  state = 'menu'; players = [];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m;
  const order = buildQueue([...Array(8).keys()].sort(()=>Math.random()-0.5)); orbitT = 0; bonusIntro = 0;
  players = mode==='solo' ? [makePlayer(0, 0, 1, order)] : [makePlayer(0, 0, 0.5, order), makePlayer(1, 0.5, 1, order)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- players ----------
function makePlayer(idx, f0, f1, order){
  return {idx, f0, f1, queue:[...order], current:null, placed:Array(8).fill(false), count:0, mistakes:0, time:0, done:false, round:'order',
          hand:{x:-999,y:-999,seen:false}, pts:null, lost:0, held:false, msg:null, slots:[], base:30,
          flags:Array(8).fill(false), rockets:[], meteors:[], metT: 7, joy:Array(8).fill(0), bonusPlaced:Array(8).fill(false)};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W;
  const w = p.x1 - p.x0, sunW = w*0.1, gap = (w - sunW - 16)/8, y = H*0.8;
  p.base = Math.min(gap*0.36, H*0.06);
  p.slots = PLANETS.map((pl,i)=>({i, x: p.x0 + sunW + gap*(i+0.5), y, r: p.base*Math.max(0.75, Math.min(pl.r, 1.25))}));
  p.bh = {x: p.x1 - w*0.1, y: H*0.24, r: Math.min(w*0.06, H*0.08)};
}
function buildQueue(order){ // แทรกดาวหลอก 3 ดวงแบบสุ่ม
  const q = [...order]; [8,9,10].forEach(f => q.splice(1 + Math.floor(Math.random()*q.length), 0, f)); return q;
}
function nextPlanet(p){
  if (!p.queue.length){ p.current = null; return; }
  const w = p.x1 - p.x0;
  p.current = {i: p.queue.shift(), x: p.x0 + w*(0.25+Math.random()*0.4), y: -60, wob: 0, bounce: 0, shake: 0, sad: 0};
}
const correctFor = (p, s) => p.round === 'order' ? s.i : SIZE_ORDER[s.i];
const slotFilled = (p, s) => p.round === 'order' ? p.placed[s.i] : p.bonusPlaced[s.i];
function nearestSlot(p, c){
  if (Math.hypot(p.bh.x - c.x, p.bh.y - c.y) < p.bh.r*1.8 && p.round === 'order') return 'bh';
  let best = null, bd = 1e9;
  for (const s of p.slots){ if (slotFilled(p, s)) continue; const d = Math.hypot(s.x-c.x, s.y-c.y); if (d < bd){ bd = d; best = s; } }
  return best && bd < Math.max(best.r*2.4, 70) ? best : null;
}
function updatePlayer(p, dt){
  for (let k=0;k<8;k++) p.joy[k] = Math.max(0, p.joy[k] - dt);
  updateRockets(p, dt); updateMeteors(p, dt);
  if (p.done || !p.current) return;
  p.time += dt;
  const c = p.current, h = p.hand, R = p.base*1.3;
  if (c.bounce > 0) c.bounce -= dt;
  c.shake = Math.max(0, c.shake - dt); c.sad = Math.max(0, c.sad - dt);
  c.near = false; p.target = null;
  if (p.held){
    if (!h.seen){ p.lost += dt; if (p.lost > 0.6) p.held = false; }
    else {
      p.lost = 0;
      c.x += (h.x-c.x)*0.55; c.y += (h.y-c.y)*0.55;
      c.x = Math.max(p.x0+R, Math.min(p.x1-R, c.x));
      p.target = nearestSlot(p, c);
      if (!h.closed){ // แบมือ = วาง
        p.held = false;
        if (p.target === 'bh') dropBlackHole(p); else if (p.target) tryPlace(p, p.target); else sfx.grab();
      }
    }
  } else if (h.seen && c.bounce <= 0 && Math.hypot(c.x-h.x, c.y-h.y) < R*1.9){
    c.near = true;
    if (h.closed && !p.wasClosed){ p.held = true; sfx.grab(); } // กำมือตอนอยู่ใกล้ = จับ
  }
  p.wasClosed = h.seen ? h.closed : false;
  if (!p.held && p.current === c){
    c.wob += dt*2;
    const stopY = H*0.4;
    if (c.y < stopY - 20) c.y = Math.min(stopY, c.y + H*0.25*dt);
    else if (c.y > stopY + 20) c.y = Math.max(stopY, c.y - H*0.35*dt);
    else c.y = stopY + Math.sin(c.wob)*12;
  }
}
function wrong(p, title, text){
  const c = p.current; p.mistakes++; sfx.bad(); p.held = false;
  p.msg = {ok:false, title, text, t:2.6}; c.y = H*0.3; c.bounce = 0.8; c.shake = 0.7; c.sad = 1.4;
}
function dropBlackHole(p){
  const c = p.current, o = OBJ[c.i];
  if (o.fake){
    sfx.whoosh(); burst(p.bh.x, p.bh.y, ['#b48cff','#ffffff','#5b35a8'], 26);
    p.msg = {ok:true, title:`เก่งมาก! ${o.n} ไม่ใช่ดาวเคราะห์`, text: o.f, t: mode==='solo'?3.5:2};
    nextPlanet(p); checkRoundDone(p);
  } else wrong(p, `อย่าทิ้ง! ${o.n} เป็นดาวเคราะห์จริงนะ`, 'ดาวเคราะห์ต้องเอาไปวางในวงโคจร');
}
function tryPlace(p, s){
  const c = p.current, o = OBJ[c.i];
  p.held = false;
  if (o.fake){ wrong(p, `${o.n} ไม่ใช่ดาวเคราะห์!`, 'ของที่ไม่ใช่ดาวเคราะห์ ให้ทิ้งลงหลุมดำมุมบนนะ'); return; }
  if (correctFor(p, s) === c.i){
    sfx.ok(); burst(s.x, s.y, [o.c1, '#ffffff', P_COLORS[p.idx]], 30);
    if (p.round === 'order'){
      p.placed[s.i] = true; p.count++; p.joy[s.i] = 1.5; launchRocket(p, s);
      p.msg = {ok:true, title:`ถูกต้อง! ${o.n} ลำดับที่ ${s.i+1}`, text: o.f, t: mode==='solo'?3.5:2};
    } else {
      p.bonusPlaced[s.i] = true; p.bonusCount = (p.bonusCount||0) + 1; p.joy[c.i] = 1.5;
      p.msg = {ok:true, title:`ถูกต้อง! ${o.n} ขนาดอันดับ ${s.i+1}`, text: SIZE_FACT[s.i], t: 3};
    }
    nextPlanet(p); checkRoundDone(p);
  } else if (p.round === 'order'){
    const hint = c.i < s.i ? 'ใกล้ดวงอาทิตย์กว่านี้' : 'ไกลดวงอาทิตย์กว่านี้';
    wrong(p, `ยังไม่ใช่! ${o.n} อยู่${hint}`, level===1 ? `หาช่องที่เขียนว่า "${o.n}"` : 'ลองนับจากดวงอาทิตย์ดูอีกที');
  } else {
    const rank = SIZE_ORDER.indexOf(c.i);
    wrong(p, `ยังไม่ใช่! ${o.n} ${rank < s.i ? 'เล็กกว่านี้' : 'ใหญ่กว่านี้'}`, 'ลองเทียบขนาดกับดาวดวงอื่นดูนะ');
  }
}
function checkRoundDone(p){
  if (p.current) return;
  if (p.round === 'order'){
    if (mode === 'solo'){ // ด่านโบนัส: เรียงขนาด
      p.round = 'bonus'; p.queue = [...Array(8).keys()].sort(()=>Math.random()-0.5); bonusIntro = 3.2; sfx.win();
      return;
    }
    finish(p);
  } else finish(p);
}
// ---------- จรวดปักธง ----------
function launchRocket(p, s){ p.rockets.push({sx: p.x0 + 30, sy: H*0.98, s, t: 0}); sfx.rocket(); }
function updateRockets(p, dt){
  for (const r of p.rockets){ r.t += dt/1.1; if (r.t >= 1 && !r.done){ r.done = true; p.flags[r.s.i] = true; burst(r.s.x, r.s.y - r.s.r, ['#ffd36b','#ffffff'], 14); sfx.flag(); } }
  p.rockets = p.rockets.filter(r => r.t < 1.15);
}
// ---------- อุกกาบาต ----------
function updateMeteors(p, dt){
  if (state !== 'play' || p.done || p.round !== 'order') { p.meteors = []; return; }
  p.metT -= dt;
  const w = p.x1 - p.x0;
  if (p.metT <= 0){
    p.metT = 6 + Math.random()*4;
    const fromLeft = Math.random() < 0.5;
    p.meteors.push({x: fromLeft ? p.x0 + w*0.1 : p.x1 - w*0.1, y: -40, vx: (fromLeft ? 1 : -1)*w*0.35, vy: H*0.55, r: p.base*0.65, warn: 0.9, rot: 0});
  }
  for (const m of p.meteors){
    if (m.warn > 0){ m.warn -= dt; continue; }
    m.x += m.vx*dt; m.y += m.vy*dt; m.rot += dt*4;
    const c = p.current;
    if (c && p.held && !m.hit && Math.hypot(c.x - m.x, c.y - m.y) < m.r + p.base*1.3){
      m.hit = true; p.held = false; c.bounce = 0.6; c.shake = 0.6; c.sad = 1.2; c.y = Math.max(c.y - 60, H*0.2);
      sfx.boom(); burst(m.x, m.y, ['#ff8a2a','#ffd36b','#ffffff'], 24);
      p.msg = {ok:false, title:'อุกกาบาตชน! ดาวหลุดมือ', text:'ระวังอุกกาบาตนะ หลบให้ทัน!', t:2.2};
    }
  }
  p.meteors = p.meteors.filter(m => m.y < H + 80 && m.x > p.x0 - 80 && m.x < p.x1 + 80);
}
function burst(x, y, colors, n){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=150+Math.random()*320;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,c:colors[i%colors.length],life:1,sq:Math.random()<0.5,rot:Math.random()*6}); }
}
function confetti(x0, x1){

// ---------- finishing ----------
function finish(p){
  p.done = true;

  endDuo(p);
}
function endSolo(p){
  state = 'over'; sfx.win(); confetti(0, W); orbitT = 0; players.forEach(q => q.msg = null);
  const t = Math.round(p.time*10)/10;
  const title = p.mistakes===0 ? 'นักบินอวกาศระดับตำนาน!' : p.mistakes<=3 ? 'นักสำรวจอวกาศตัวจริง!' : 'นักดาราศาสตร์ฝึกหัด!';
  setTimeout(()=>{
    players.forEach(q => q.msg = null);
    pixelTitle(document.getElementById('endTitle'), title, null);
    document.getElementById('endText').innerHTML = `เรียงลำดับและขนาดครบใน <b>${t.toFixed(1)}</b> วินาที · พลาด ${p.mistakes} ครั้ง<br>` +
      `<br><span style="font-size:.85em">จำง่าย ๆ: พุธ ศุกร์ โลก อังคาร พฤหัส เสาร์ ยูเรนัส เนปจูน</span>`;
    document.getElementById('end').classList.remove('hidden');
  }, 6500);
}
function endDuo(winner){
  state = 'over'; sfx.win();
  const [a, b] = players;
  let title, w = winner;
  if (!w){ // หมดเวลา
    w = a.count > b.count ? a : b.count > a.count ? b : (a.mistakes < b.mistakes ? a : b.mistakes < a.mistakes ? b : null);
  }
  if (w){ title = `${P_NAMES[w.idx]}ชนะ!`; confetti(w.x0, w.x1); banner = {text: 'ชนะ!', p: w}; }
  else { title = 'เสมอกัน! เก่งทั้งคู่'; confetti(0, W); }
  setTimeout(()=>{
    players.forEach(q => q.msg = null);
    pixelTitle(document.getElementById('endTitle'), title, w ? P_COLORS[w.idx] : '#ffcf33');
    const line = p => `<b style="color:${P_COLORS[p.idx]}">${P_NAMES[p.idx]}</b> วางได้ ${p.count}/8 ดวง · ${p.time.toFixed(1)} วิ · พลาด ${p.mistakes}`;
    document.getElementById('endText').innerHTML = `${line(a)}<br>${line(b)}<br><span style="font-size:.85em">จำง่าย ๆ: พุธ ศุกร์ โลก อังคาร พฤหัส เสาร์ ยูเรนัส เนปจูน</span>`;
    document.getElementById('end').classList.remove('hidden');
  }, 2200);
}

let handOK = false, landmarker = null, lastVideoTime = -1;
let mouseDown = false;
addEventListener('mousedown', ()=>{ mouseDown = true; players.forEach(p => { if (!handOK) p.hand.closed = p.hand.seen; }); });
addEventListener('mouseup', ()=>{ mouseDown = false; players.forEach(p => { if (!handOK) p.hand.closed = false; }); });
addEventListener('mousemove', e=>{
  if (handOK || !players.length) return;
  const p = players.find(p => e.clientX >= p.x0 && e.clientX < p.x1) || players[0];
  players.forEach(q => { if (q !== p) q.hand.seen = false; });
  p.hand.x = e.clientX; p.hand.y = e.clientY; p.hand.seen = true; p.hand.closed = mouseDown;
});
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(){
  if (!handOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now());
  const found = (r.landmarks || []).map(L => {
    const pts = L.map(mapPt), c = mapPt({x:(L[0].x+L[9].x)/2, y:(L[0].y+L[9].y)/2});
    return {pts, c};
  });
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i];
    if (!f){ p.hand.seen = false; p.hand.closed = false; p.pts = null; return; }
    p.pts = f.pts; const P = f.pts;
    const d = (a,b)=>Math.hypot(P[a].x-P[b].x, P[a].y-P[b].y), palm = d(0,9) || 1;
    const ratio = (d(8,0)+d(12,0)+d(16,0)+d(20,0))/4/palm;
    p.hand.closed = p.hand.closed ? ratio < 1.55 : ratio < 1.25;
    const cx = (P[0].x+P[5].x+P[9].x+P[13].x+P[17].x)/5, cy = (P[0].y+P[5].y+P[9].y+P[13].y+P[17].y)/5;
    p.hand.x = p.hand.seen ? p.hand.x + (cx-p.hand.x)*0.55 : cx;
    p.hand.y = p.hand.seen ? p.hand.y + (cy-p.hand.y)*0.55 : cy;
    p.hand.seen = true;

  });
}

function drawFace(x, y, r, mood, lookX=0, lookY=0){

    ctx.fillStyle = `rgba(255,${150+Math.random()*80|0},40,.9)`; ctx.beginPath(); ctx.moveTo(-s*0.35, s*1.1); ctx.lineTo(0, s*1.9 + Math.random()*s*0.4); ctx.lineTo(s*0.35, s*1.1); ctx.fill();
    ctx.fillStyle = '#e8e8f4'; ctx.beginPath(); ctx.moveTo(0, -s*1.4); ctx.quadraticCurveTo(s*0.6, -s*0.6, s*0.5, s*1.1); ctx.lineTo(-s*0.5, s*1.1); ctx.quadraticCurveTo(-s*0.6, -s*0.6, 0, -s*1.4); ctx.fill();
    ctx.fillStyle = '#e04d8c'; ctx.beginPath(); ctx.moveTo(-s*0.5, s*0.5); ctx.lineTo(-s*0.9, s*1.2); ctx.lineTo(-s*0.45, s*1.1); ctx.fill(); ctx.beginPath(); ctx.moveTo(s*0.5, s*0.5); ctx.lineTo(s*0.9, s*1.2); ctx.lineTo(s*0.45, s*1.1); ctx.fill();
    ctx.fillStyle = '#4fb8ff'; ctx.beginPath(); ctx.arc(0, -s*0.3, s*0.28, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawMeteors(p){
  for (const m of p.meteors){
    if (m.warn > 0){ if (Math.floor(m.warn*8)%2) label('!', m.x, 40, 40, '#ff8a2a'); continue; }
    const len = 5, tx = m.x - m.vx*0.18, ty = m.y - m.vy*0.18;
    const g = ctx.createLinearGradient(tx, ty, m.x, m.y); g.addColorStop(0,'rgba(255,120,40,0)'); g.addColorStop(1,'rgba(255,180,60,.9)');
    ctx.strokeStyle = g; ctx.lineWidth = m.r*1.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
    ctx.fillStyle = '#7a5a48'; ctx.beginPath(); for (let k=0;k<8;k++){ const a = k/8*Math.PI*2, rr = m.r*(0.8+0.2*Math.sin(k*3)); k ? ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(m.r*0.25, -m.r*0.2, m.r*0.22, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
// ---------- ฉากจบ: ดาวโคจรรอบดวงอาทิตย์ ----------
let orbitT = 0;
function drawOrbit(dt){
  orbitT += dt;
  const p = players[0], cx = W*0.5, cy = H*0.52, k = Math.min(1, orbitT/1.6), ease = 1 - Math.pow(1-k, 3);
  const maxR = Math.min(W*0.46, H*0.9), base = maxR*0.17, step = (maxR - base)/7;
  const sr = Math.min(W,H)*0.07*ease;
  const sg = ctx.createRadialGradient(cx, cy, sr*0.1, cx, cy, sr*2.2);
  sg.addColorStop(0,'#fffbe0'); sg.addColorStop(0.4,'#ffd34d'); sg.addColorStop(0.65,'#ff8a2a'); sg.addColorStop(1,'rgba(255,90,20,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, sr*2.2, 0, Math.PI*2); ctx.fill();
  for (let i=0;i<8;i++){
    const R = base + step*i, ry = R*0.42;
    ctx.strokeStyle = `rgba(200,190,255,${0.35*ease})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, R, ry, 0, 0, Math.PI*2); ctx.stroke();
    const a = i*0.9 + orbitT*1.4/Math.pow(i+1, 0.9);
    const ox = cx + Math.cos(a)*R, oy = cy + Math.sin(a)*ry, s = p.slots[i];
    const x = s.x + (ox - s.x)*ease, y = s.y + (oy - s.y)*ease;
    const pr = Math.max(8, p.base*0.9*Math.max(0.6, Math.min(PLANETS[i].r, 1.3)));
    drawPlanet(i, x, y, pr, 'happy');
    if (i === 2 && ease > 0.5){ // ดวงจันทร์โคจรรอบโลก
      const ma = orbitT*3.2, md = pr*1.9, mr = Math.max(6, pr*0.42);
      ctx.strokeStyle = `rgba(230,230,240,${0.35*ease})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, md, md*0.55, 0, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = Math.min(1, (ease-0.5)*2);
      drawPlanet(8, x + Math.cos(ma)*md, y + Math.sin(ma)*md*0.55, mr, 'happy');
      ctx.globalAlpha = 1;
      if (orbitT > 1.6 && orbitT < 5) label('ดวงจันทร์โคจรรอบโลก', x, y - pr - 22, Math.max(13, pr*0.55), '#e8e8f4');
    }
  }
  if (orbitT > 0.8) label('ระบบสุริยะของเรา!', W/2, H*0.1, Math.min(W,H)*0.07, '#ffd36b');
}
let bonusIntro = 0;
function drawBonusIntro(dt){
  if (bonusIntro <= 0) return;
  bonusIntro -= dt;
  const f = Math.min(W,H)*0.045, w = Math.min(W*0.8, 860), h = f*4.2, x = (W-w)/2, y = H*0.24;
  sticker(x, y, w, h, 'rgba(28,22,80,.95)', 24);
  label('ด่านโบนัส!', W/2, y + f*1.2, f*1.4, '#ffd36b');
  label('เรียงดาวเคราะห์จากเล็กที่สุด ไปใหญ่ที่สุด', W/2, y + f*2.9, f*0.8, '#fff');
  if (bonusIntro <= 0) players.forEach(nextPlanet);
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(p){
  if (!p.hand.seen) return;
  const col = mode==='duo' ? P_COLORS[p.idx] : '#8fd0ff', closed = p.hand.closed;
  if (p.pts){ // หน้าตามือแบบเดิม
    const P = p.pts; ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,30,.7)'; ctx.lineWidth=8; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(P[a].x,P[a].y); ctx.lineTo(P[b].x,P[b].y); ctx.stroke(); }
    ctx.strokeStyle=col; ctx.lineWidth=4; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(P[a].x,P[a].y); ctx.lineTo(P[b].x,P[b].y); ctx.stroke(); }
    ctx.fillStyle='#fff'; for (const q of P){ ctx.beginPath(); ctx.arc(q.x,q.y,5,0,Math.PI*2); ctx.fill(); }
  }
  { const r = Math.min(W,H)*0.045; ctx.beginPath(); ctx.arc(p.hand.x,p.hand.y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,30,.7)'; ctx.lineWidth=10; ctx.stroke();
    ctx.strokeStyle = p.held || closed ? '#ffd36b' : col; ctx.lineWidth=5; ctx.stroke();
    if (!p.pts){ ctx.font = `${r*1.2}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(closed ? '✊' : '🖐️', p.hand.x, p.hand.y); } }
  if (p.held){ const f = Math.max(14, Math.min(W,H)*0.024), t = p.target ? 'แบมือเพื่อวาง' : 'ลากไปวงโคจร', y = p.hand.y + Math.min(W,H)*0.09;
    U.font = `800 ${f}px ${FONT}`; const w = U.measureText(t).width + 24; sticker(p.hand.x - w/2, y, w, f*1.6, 'rgba(28,22,80,.85)', 99);
    U.fillStyle = p.target ? '#ffd36b' : '#fff'; U.textAlign='center'; U.textBaseline='middle'; U.fillText(t, p.hand.x, y + f*0.8); }
}
function drawHUD(p, t){
  const ctx = U;
  const f = Math.max(18, Math.min(W,H)*0.04);
  ctx.font = `800 ${f}px Kanit,Tahoma,sans-serif`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const txt = mode==='solo' ? `เวลา ${p.time.toFixed(1)} วิ    วางแล้ว ${p.count}/8`
                            : `${P_NAMES[p.idx]}   ${p.count}/8`;
  const w = ctx.measureText(txt).width + 36, x = mode==='solo' ? 16 : (p.idx===0 ? p.x0+16 : p.x1-16-w-8);
  sticker(x, 16, w, f*1.7, mode==='duo' ? P_COLORS[p.idx] : PAPER, 99);
  ctx.fillStyle = '#fff'; ctx.fillText(txt, x+18, 16+f*0.85);
  // แถบความคืบหน้า
  const bw = Math.min(260, (p.x1-p.x0)*0.4), bx = mode==='solo' ? 16 : (p.idx===0 ? p.x0+16 : p.x1-16-bw-8), by = 16+f*1.7+14;
  ctx.fillStyle='rgba(255,255,255,.15)'; ctx.beginPath(); ctx.roundRect(bx,by,bw,12,6); ctx.fill();
  const pg = ctx.createLinearGradient(bx,0,bx+bw,0); pg.addColorStop(0,'#ffd36b'); pg.addColorStop(1,'#ff7fb5');
  if (p.count){ ctx.fillStyle=pg; ctx.beginPath(); ctx.roundRect(bx,by,bw*p.count/8,12,6); ctx.fill(); }
}
function drawDuoMiddle(){
  const ctx = U;
  ctx.strokeStyle='rgba(200,190,255,.5)'; ctx.lineWidth=3; ctx.setLineDash([10,12]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  const f = Math.max(16, Math.min(W,H)*0.035), remain = Math.max(0, DUO_LIMIT - playT);
  const txt = `${Math.ceil(remain)}`, w = f*3.2;
  sticker(W/2-w/2, 14, w, f*1.8, remain < 15 ? 'rgba(224,77,140,.9)' : PAPER, 99);
  ctx.font=`800 ${f*1.1}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
  ctx.fillText(txt, W/2, 14+f*0.9);
  label('VS', W/2, H*0.55, Math.min(W,H)*0.07, '#ffcf33');
}
function drawMsg(p, dt){
  const ctx = U;
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const pw = p.x1-p.x0, solo = mode==='solo';
  const f = Math.max(18, Math.min(pw, H*1.6)*(solo?0.03:0.036));
  const w = Math.min(pw*0.9, 950), h = solo ? f*3.3 : f*2, x = p.x0 + (pw-w)/2, y = solo ? 16+f*4 : H*0.13;
  ctx.globalAlpha = Math.min(1, m.t*2);
  sticker(x, y, w, h, 'rgba(28,22,80,.92)', 22);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${f}px Kanit,Tahoma,sans-serif`; ctx.fillStyle = m.ok ? '#7dffb0' : '#ff8a9a';
  ctx.fillText(m.title, x+w/2, y + (solo ? f*1.05 : h/2), w-24);
  if (solo){ ctx.font=`${f*0.85}px Kanit,Tahoma,sans-serif`; ctx.fillStyle='#fff'; ctx.fillText(m.text, x+w/2, y+f*2.3, w-24); }
  ctx.globalAlpha = 1;
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); } else p.vy += 520*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow?0.6:1.2); p.rot += dt*6;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.slow ? 5 : 4, 0, Math.PI*2); ctx.fill();

  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40);
}
let lastBeep = 4;
function drawCountdown(dt){
  const ctx = U;
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){
    if (lastBeep !== 0){ sfx.go(); lastBeep = 0; }
    state = 'play'; playT = 0; players.forEach(nextPlanet); banner = {text:'ไป!', t:0.8};
    return;
  }
  const frac = countdown - Math.floor(countdown), size = Math.min(W,H)*(0.22 + 0.08*frac);
  label(String(n), W/2, H*0.42, size, '#ffcf33');
  label(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'ยกมือขึ้น เตรียมกำดาวเคราะห์!', W/2, H*0.62, Math.min(W,H)*0.05);
}
function drawBanner(dt){
  if (!banner || banner.p) return;
  banner.t -= dt; if (banner.t <= 0){ banner = null; return; }
  label(banner.text, W/2, H*0.42, Math.min(W,H)*0.25*(1+ (0.8-banner.t)*0.4), '#7be39a');
}
function drawWinner(){
  if (!banner || !banner.p) return;
  const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
  label('ชนะ!', (p.x0+p.x1)/2, H*0.42, Math.min(W,H)*0.16*s, P_COLORS[p.idx]);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(); U.clearRect(0,0,W,H); drawBG(t);
  if (state !== 'menu' && players.length){
    if (state === 'play'){
      playT += dt;
      if (bonusIntro <= 0) players.forEach(p => updatePlayer(p, dt));
      if (mode === 'duo' && playT >= DUO_LIMIT && state === 'play') endDuo(null);
    }
    if (mode === 'duo') drawDuoMiddle();
    if (mode === 'solo' && state === 'over') drawOrbit(dt);
    else {
      players.forEach(p => drawBlackHole(p, t));
      players.forEach(drawSystem);
      if (state === 'play') players.forEach(drawCurrent);
      players.forEach(drawRockets); players.forEach(drawMeteors);
    }
    drawBonusIntro(dt);
    players.forEach(p => drawHUD(p, t));
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    drawBanner(dt); drawWinner();
  }
  drawParticles(dt);
  players.forEach(drawHand);
  requestAnimationFrame(loop);
}
window.__p = () => players;
window.__s = () => ({state, bonusIntro, orbitT, SO: SIZE_ORDER, fake: i => !!OBJ[i].fake});
function pixelTitle(el, text, color){ el.textContent = text; el.style.background = color ? 'none' : ''; el.style.color = color || ''; }
resize(); initHands(); requestAnimationFrame(loop);
</script>
